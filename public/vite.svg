  <path d="M 11 14.5 L 14 16.2" stroke="#22C7C7" stroke-width="1" stroke-linecap="round" />
  <path d="M 11 17 L 13.5 18.5" stroke="#22C7C7" stroke-width="1" stroke-linecap="round" stroke-opacity="0.5" />

