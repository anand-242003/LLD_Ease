      <stop offset="0%" stop-color="#0E2328" />
      <stop offset="60%" stop-color="#071518" />
      <stop offset="100%" stop-color="#03090B" />
    </linearGradient>
    <linearGradient id="fav-rim" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
