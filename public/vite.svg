  <path d="M 16 15.5 L 23 11.5 L 23 20 L 16 24 Z" fill="url(#fav-right)" stroke="#38BDF8" stroke-width="0.7" stroke-opacity="0.5" />
  <path d="M 18 16.2 L 21 14.5" stroke="#38BDF8" stroke-width="1" stroke-linecap="round" />
  <path d="M 18 18.5 L 20.5 17" stroke="#38BDF8" stroke-width="1" stroke-linecap="round" stroke-opacity="0.5" />

