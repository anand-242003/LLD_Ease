      <stop offset="50%" stop-color="#22C7C7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="fav-top" x1="9" y1="7" x2="23" y2="15" gradientUnits="userSpaceOnUse">
